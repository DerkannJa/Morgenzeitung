# Morgenzeitung – Konfiguration
# Wird vor jedem Lauf automatisch von GitHub geholt – Änderungen im Repo machen, nicht im LXC.
# Zugangsdaten stehen getrennt in /opt/morgenzeitung/geheim.toml. Sofort testen: zeitung-update

[zeitung]
titel = "Lukas Morgenzeitung"
ausgabe_ordner = "/opt/morgenzeitung/ausgaben"
max_woerter_pro_artikel = 900     # lange Artikel werden gekürzt
behalten_tage = 14                 # alte EPUBs danach löschen
verlauf_datei = "/opt/morgenzeitung/verlauf.json"   # merkt sich gezeigte Berichte
verlauf_tage = 21                  # so lange gilt ein Bericht/Thema als "schon gelesen"

[mail]
smtp_server = "smtp.gmail.com"
smtp_port = 587
absender = "DEINE_GMAIL_ADRESSE@gmail.com"   # muss bei Amazon als genehmigter Absender eingetragen sein
app_passwort = "xxxx xxxx xxxx xxxx"          # Google-App-Passwort, NICHT dein normales Passwort
kindle_adresse = "luka.geiss_9LgRqi@kindle.com"

[homeassistant]
url = "http://192.168.178.173:8123"
token = "LANGLEBIGES_HA_TOKEN"
wetter = "weather.forecast_home"
kalender = ["calendar.claude", "calendar.google_luka", "calendar.abfall"]
kalender_tage = 2                  # heute + morgen
feiertage = "calendar.app_deutschland_he"   # Feiertage Deutschland + Hessen
feiertage_tage = 7                 # Feiertage so viele Tage im Voraus anzeigen

[anime]
# AniList: alle Serien auf "Watching" (und "Rewatching"); an Tagen mit neuer Folge
# erscheint auf der Titelseite der Kasten "Anime – neue Folgen heute".
# Liste muss öffentlich sein. Uhrzeit = Stream-Start mit Untertiteln (meist Crunchyroll)
# laut animeschedule.net, automatisch; fehlt die Serie dort, TV-Ausstrahlung Japan.
anilist_nutzer = "drkR4i"
titel = "romaji"                   # "romaji" (z. B. Sousou no Frieren) oder "english"

[gamepass]
# Meldet eine Newsseite "Xbox Game Pass loses/leaving ...", stehen die Spiele, deren 100 % laut
# HowLongToBeat ("Completionist") höchstens max_stunden dauern, bis zu ihrem Abgangsdatum auf der
# Titelseite (eine Zeile je Spiel). TrueAchievements selbst sperrt Server aus und wird übersprungen.
datei = "/opt/morgenzeitung/gamepass.json"   # merkt sich gefundene Spiele bis zum Abgang
feeds = ["https://news.google.com/rss/search?q=%22Game+Pass%22+(leaving+OR+loses)+when:7d&hl=en-US&gl=US&ceid=US:en"]
max_stunden = 12
max_alter_stunden = 168
max_artikel = 6

# ---------------------------------------------------------------
# Rubriken: Reihenfolge = Reihenfolge in der Zeitung
#   anzahl     = maximale Artikel aus dieser Rubrik
#   volltext   = true: kompletten Artikel laden (klappt auch bei Google-News-Feeds)
#                false: nur Überschrift + Kurztext
#   nur_mit_text = true: Meldungen ohne lesbaren Artikeltext überspringen
#   max_woerter  = Kürzungsgrenze nur für diese Rubrik
#   stichwoerter = nur Berichte, die mindestens eines dieser Wörter enthalten
#   ausschluss   = Berichte mit einem dieser Wörter fliegen raus
#   plattformen / andere_plattformen = nur Berichte zu diesen Plattformen, nicht vor allem zu den anderen
#   kein_sport   = true: Berichte über echten Sport fliegen raus (Videospiele wie Madden/EA FC bleiben)
# Berichte, die schon in einer früheren Ausgabe standen, und Berichte zum selben
# Thema (auch aus anderer Quelle) erscheinen nur einmal.
#   max_alter_stunden = ältere Meldungen werden ignoriert
# Google-News-Suche als Feed:
#   https://news.google.com/rss/search?q=SUCHBEGRIFF&hl=de&gl=DE&ceid=DE:de
# ---------------------------------------------------------------

[[rubrik]]
name = "Nachrichten"
feeds = ["https://www.tagesschau.de/index~rss2.xml"]
anzahl = 5
volltext = true
max_alter_stunden = 24

[[rubrik]]
name = "Lokales"
feeds = ["https://news.google.com/rss/search?q=M%C3%B6rfelden-Walldorf+when:3d&hl=de&gl=DE&ceid=DE:de",
         "https://www.hessenschau.de/suedhessen/index.rss",
         "https://news.google.com/rss/search?q=%22Kreis+Gro%C3%9F-Gerau%22+when:2d&hl=de&gl=DE&ceid=DE:de"]
anzahl = 5
volltext = true          # Artikeltext laden (Google-News-Links werden aufgelöst)
nur_mit_text = true      # Meldungen ohne lesbaren Text überspringen (z. B. Bezahlschranke)
max_woerter = 500
max_alter_stunden = 168
# Ortsnamen stehen in fast jedem Lokaltitel und zählen beim Themenvergleich nicht
themen_ignorieren = ["Mörfelden", "Walldorf", "Mörfelden-Walldorf", "Groß-Gerau", "Gerau", "Südhessen", "Hessen", "Darmstadt", "Frankfurt", "Rüsselsheim", "Langen", "Kelsterbach"]

